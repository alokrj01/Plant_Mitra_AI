[project]
name = "plant-mitra-ai"
version = "1.0.0"
description = "AI-powered plant disease detection and treatment system"
requires-python = ">=3.12, <3.13"

dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "python-multipart==0.0.12",
  "pydantic==2.9.2",
  "sqlalchemy==2.0.46",
  "torch==2.8.0+cpu",
  "torchvision==0.23.0+cpu",
  "transformers==4.45.2",
  "huggingface-hub==0.25.2",
  "pillow==12.0.0",
  "joblib==1.4.2",
  "scikit-learn==1.6.1",
  "pwdlib[argon2]>=0.3.1",
  "pyjwt>=2.13.0",
  "email-validator>=2.3.0",
  "pydantic-settings>=2.15.0",
  "psycopg[binary]>=3.3.4",
  "alembic>=1.19.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false

constraint-dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "filelock==3.20.0",
    "fsspec==2025.12.0",
    "greenlet==3.3.1",
    "h11==0.16.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "markupsafe==2.1.5",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.2.6",
    "packaging==26.0",
    "pydantic-core==2.23.4",
    "pyyaml==6.0.3",
    "regex==2024.9.11",
    "requests==2.32.5",
    "safetensors==0.4.5",
    "scipy==1.14.1",
    "setuptools==70.2.0",
    "starlette==0.38.6",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.20.1",
    "tqdm==4.66.5",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]
